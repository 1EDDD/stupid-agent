name: VOID unsigned IPA

on:
  push:
    branches:
      - void-stable-research
    paths:
      - ".github/workflows/void-ipa.yml"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "Tests/**"
      - "scripts/**"
      - "Info.plist"
      - "App.entitlements"
      - "stupid-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: void-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package unsigned iOS IPA
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched stupid-app CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.0.27 https://github.com/stephancill/stupid-app-cli.git "$RUNNER_TEMP/stupid-app-cli"
          python3 - "$RUNNER_TEMP/stupid-app-cli/Sources/BuildCore/ProcessRunner.swift" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = "maxOutputBytes: Int = 20_000"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one ProcessRunner output cap")
          path.write_text(source.replace(old, "maxOutputBytes: Int = 5_000_000"))
          PY
          swift build --package-path "$RUNNER_TEMP/stupid-app-cli" --configuration release --product stupid-app
          CLI_PATH="$(find "$RUNNER_TEMP/stupid-app-cli/.build" -type f -path '*/release/stupid-app' -perm -111 | head -n 1)"
          test -n "$CLI_PATH"
          test -x "$CLI_PATH"
          echo "$(dirname "$CLI_PATH")" >> "$GITHUB_PATH"
          uname -m
          xcodebuild -version
          swift --version
          "$CLI_PATH" --version
          xcode-select -p
          xcrun --find swift

      - name: Run core tests
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Diagnose SwiftPM package descriptions
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/diagnose-swiftpm.swift "$(xcrun --find swift)"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          stupid-app build --swift "$(xcrun --find swift)" --configuration release 2>&1 | tee "$RUNNER_TEMP/void-build.log"

          APP_PATH="$(awk -F ' at ' '/^Built .*\.app at / {print $NF}' "$RUNNER_TEMP/void-build.log" | tail -n 1)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "Could not locate the app bundle reported by stupid-app build."
            find . -type d -name '*.app' -print
            exit 1
          fi

          APP_EXECUTABLE="$APP_PATH/StupidAgent"
          test -f "$APP_EXECUTABLE"
          file "$APP_EXECUTABLE"
          plutil -lint "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"

          mkdir -p "$RUNNER_TEMP/void-ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/void-ipa/Payload/$(basename "$APP_PATH")"
          (
            cd "$RUNNER_TEMP/void-ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/VOID-unsigned.ipa" Payload
          )
          unzip -t "$GITHUB_WORKSPACE/VOID-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/VOID-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VOID-unsigned-IPA
          path: VOID-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VOID-build-log
          path: ${{ runner.temp }}/void-build.log
          if-no-files-found: ignore
          retention-days: 7
